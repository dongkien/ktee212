<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KTEE212 Policy Analysis - Lecture Notes</title>
<style>
  :root { --navy:#0E2C54; --red:#9B1B1E; --paper:#f4f5f7; --line:#d8dce3; --ink:#1c2430; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:Cambria,Georgia,"Times New Roman",serif;
               background:var(--paper); color:var(--ink);
               -webkit-user-select:none; user-select:none; }
  body { display:flex; flex-direction:column; }
  header { background:var(--navy); color:#fff; padding:10px 16px;
           display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header .brand { font-weight:bold; letter-spacing:.06em; font-size:14px; }
  header .course { font-size:13px; opacity:.8; }
  header .spacer { flex:1; }
  button, input { font-family:inherit; font-size:14px; }
  .ctrl { background:#fff; color:var(--navy); border:1px solid var(--line);
          border-radius:4px; padding:5px 12px; cursor:pointer; }
  .ctrl:hover { background:#e9edf3; }
  .ctrl:disabled { opacity:.4; cursor:default; }
  #pageBox { width:64px; text-align:right; padding:5px 6px;
             border:1px solid var(--line); border-radius:4px; }
  .total { font-size:13px; color:#cfd6e0; }
  main { flex:1; display:flex; min-height:0; }
  #toc { width:320px; background:#fff; border-right:1px solid var(--line);
         overflow-y:auto; padding:10px 0; }
  #toc h2 { font-size:12px; letter-spacing:.12em; text-transform:uppercase;
            color:#6b7280; margin:6px 16px 10px; }
  #toc a { display:flex; gap:10px; padding:8px 16px; text-decoration:none;
           color:var(--ink); border-left:3px solid transparent; font-size:14px; }
  #toc a:hover { background:#eef1f6; }
  #toc a.on { border-left-color:var(--red); background:#f3f5f9; }
  #toc a.vol { background:#f7f8fa; font-weight:bold; color:var(--navy); }
  #toc .part { color:var(--navy); font-weight:bold; min-width:62px; }
  #toc .pg { margin-left:auto; color:#8b93a0; font-size:12px; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center;
           padding:14px; min-width:0; position:relative; overflow:auto; }
  #sheet { height:100%; aspect-ratio:1/1.4142; max-width:100%;
           background-color:#fff; background-repeat:no-repeat;
           background-size:contain; background-position:center;
           border:1px solid var(--line); box-shadow:0 2px 14px rgba(14,44,84,.13); }
  .nav { position:absolute; top:0; bottom:0; width:13%; border:0;
         background:transparent; cursor:pointer; opacity:0; }
  .nav:hover { opacity:1; background:linear-gradient(transparent, rgba(14,44,84,.05)); }
  #prevZone { left:0; } #nextZone { right:0; }
  footer { background:#fff; border-top:1px solid var(--line); padding:7px 16px;
           font-size:12px; color:#6b7280; display:flex; gap:16px; flex-wrap:wrap; }
  #tocToggle { display:none; }
  @media (max-width:900px) {
    #toc { position:fixed; z-index:9; top:0; bottom:0; left:-330px;
           transition:left .2s; box-shadow:0 0 20px rgba(0,0,0,.2); }
    #toc.open { left:0; }
    #tocToggle { display:inline-block; }
    #sheet { height:auto; width:100%; }
  }
  @media print { body { display:none !important; } }
</style>
</head>
<body>
<header>
  <button class="ctrl" id="tocToggle">Mục lục</button>
  <span class="brand">TRƯỜNG ĐẠI HỌC NGOẠI THƯƠNG</span>
  <span class="course">KTEE212 · Policy Analysis · Lecture Notes</span>
  <span class="spacer"></span>
  <button class="ctrl" id="prev">&#8592; Trang trước</button>
  <input id="pageBox" type="text" inputmode="numeric" value="1">
  <span class="total">/ 187</span>
  <button class="ctrl" id="next">Trang sau &#8594;</button>
</header>
<main>
  <nav id="toc"><h2>Mục lục · Contents</h2><div id="tocList"></div></nav>
  <div id="stage">
    <button class="nav" id="prevZone" aria-label="Trang trước"></button>
    <div id="sheet" role="img" aria-label="Trang ghi chép bài giảng"></div>
    <button class="nav" id="nextZone" aria-label="Trang sau"></button>
  </div>
</main>
<footer>
  <span>Dùng phím &#8592; &#8594; để lật trang, hoặc gõ số trang vào ô trên.</span>
  <span>Tài liệu học tập nội bộ, không phát tán ra ngoài lớp.</span>
</footer>
<script>
const SECTIONS = [{"part": "Tập 1", "topic": "Chương 1-2 · Buổi 1-5", "start": 1}, {"part": "Buổi 1", "topic": "What Is Policy Analysis?", "start": 5}, {"part": "Buổi 2", "topic": "Overview of Policy Analysis", "start": 16}, {"part": "Buổi 3", "topic": "Market Failure: The Rationale for Intervention", "start": 30}, {"part": "Buổi 4", "topic": "Other Objectives for Public Intervention", "start": 46}, {"part": "Buổi 5", "topic": "Government Failure", "start": 61}, {"part": "Tập 2", "topic": "Chương 3-4 · Buổi 7-12", "start": 78}, {"part": "Buổi 7", "topic": "Generic Policies and Adoption", "start": 82}, {"part": "Buổi 8", "topic": "Implementation and Make-or-Buy", "start": 97}, {"part": "Buổi 9", "topic": "Gathering Information and Organising the Analysis", "start": 112}, {"part": "Buổi 10", "topic": "Cost-Benefit Analysis: Concepts", "start": 131}, {"part": "Buổi 11", "topic": "A Cost-Benefit Analysis from Start to Finish", "start": 148}, {"part": "Buổi 12", "topic": "Evidence: How Do We Know the Effect Is Real?", "start": 170}];
const TOTAL = 187;
const pad = n => String(n).padStart(3, "0");
const sheet = document.getElementById("sheet");
const box = document.getElementById("pageBox");
const cache = new Map();
let cur = 0;
function url(n) { return "pages/p" + pad(n) + ".webp"; }
function warm(n) {
  if (n < 1 || n > TOTAL || cache.has(n)) return;
  const im = new Image(); im.src = url(n); cache.set(n, im);
  if (cache.size > 40) cache.delete(cache.keys().next().value);
}
function show(n, push) {
  n = Math.min(TOTAL, Math.max(1, n | 0));
  cur = n;
  sheet.style.backgroundImage = 'url("' + url(n) + '")';
  box.value = n;
  document.getElementById("prev").disabled = n === 1;
  document.getElementById("next").disabled = n === TOTAL;
  for (let d = 1; d <= 3; d++) { warm(n + d); warm(n - d); }
  let on = null;
  for (const s of SECTIONS) if (n >= s.start) on = s.start;
  document.querySelectorAll("#tocList a").forEach(a => {
    const live = Number(a.dataset.start) === on;
    a.classList.toggle("on", live);
    if (live) a.scrollIntoView({ block: "nearest" });
  });
  if (push !== false) history.replaceState(null, "", "#p=" + n);
}
const list = document.getElementById("tocList");
list.innerHTML = SECTIONS.map(s =>
  '<a href="#p=' + s.start + '" data-start="' + s.start + '"' +
  (s.part.startsWith("Tập") ? ' class="vol"' : '') + '>' +
  '<span class="part">' + s.part + '</span><span>' + s.topic + '</span>' +
  '<span class="pg">' + s.start + '</span></a>').join("");
list.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault(); show(Number(a.dataset.start));
  document.getElementById("toc").classList.remove("open");
});
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("prevZone").onclick = () => show(cur - 1);
document.getElementById("nextZone").onclick = () => show(cur + 1);
document.getElementById("tocToggle").onclick = () =>
  document.getElementById("toc").classList.toggle("open");
box.addEventListener("change", () => show(Number(box.value)));
addEventListener("keydown", e => {
  if (e.target === box) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { show(cur + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { show(cur - 1); e.preventDefault(); }
  else if (e.key === "Home") show(1);
  else if (e.key === "End") show(TOTAL);
  else if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "p")) e.preventDefault();
});
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("dragstart", e => e.preventDefault());
const m = location.hash.match(/p=(\d+)/);
show(m ? Number(m[1]) : 1);
</script>
</body>
</html>
